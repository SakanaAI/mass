name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Preview both cycles
        run: |
          python -m mass plan --config configs/paper.json
          python -m mass plan --config configs/cycle2.json
      - name: Check reviewed source files
        run: python tools/check_source.py
